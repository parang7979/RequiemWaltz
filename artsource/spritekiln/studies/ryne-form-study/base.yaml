animations:
  idle:
    frames: 6
    ms: 145
    channels:
      bob: "-0.008 + 0.018*sin(p)"
      squash: "1 + 0.009*sin(p)"
      head_pitch: "-0.04 + 0.022*sin(p - 0.35)"
      foot_L: "[0.13, 0, 0.21*yaw/90]"
      foot_R: "[0.13, 0, -0.21*yaw/90]"
      hand_L: "[0.275, 0.035 + 0.014*sin(p - 0.4), 0.03 + 0.08*yaw/90]"
      hand_R: "[0.275, 0.046 + 0.014*sin(p - 0.7), 0.03 - 0.08*yaw/90]"
      coat: "0.13*sin(p - 0.9)"
      pony_swing: "0.105*sin(p - 0.78)"
sockets:
  sole: {bone: root, offset: [0, 0, 0]}
review:
