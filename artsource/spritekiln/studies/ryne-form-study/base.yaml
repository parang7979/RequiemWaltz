spritekiln: 1
name: ryne_base
extends: side_humanoid
size: 96
directions: [e, w]
mirror: false
camera: {pitch: 0, scale: 0.0315, center: [0, 1.18, 0]}
brief:
  summary: Ryne, a light-footed explorer in a dropped crimson flight jacket over a fitted graphite shorts suit. A pale bust panel, gunmetal belt and fingerless gloves sit above thigh straps and tall, buckled riding boots.
  head: A high silver ponytail hooks up from a dark ribbon, falls in an S-curve behind the head and splits into pointed locks. A side-swept fringe frames a small, wine-red eye and a pointed chin.
  reference: User's Ryne concept art and gameplay pose sheets. The sprite follows the larger head and shorter torso in the gameplay poses. Both profiles turn slightly towards the viewer.
  must_keep: [silver_fringe, high_ponytail, dropped_jacket, thigh_and_boot]
  simplify: Merge buckles into a few bright pixels, keep the hanging jacket panels separate, and reserve the brightest whites for the hair. The energized blade appears only when drawn.
remove: [animations.run, animations.jump, animations.rise, animations.fall, animations.land, animations.crouch, animations.attack, animations.hurt, animations.death]
ramps:
  argent: ["#463347", "#77617d", "#ad96b0", "#cbb3c8", "#e8d4df", "#fff0eb"]
  complexion: ["#674052", "#9f6673", "#ca8f91", "#ecb5ab", "#ffd5c6", "#ffe6d4"]
  cinnabar: ["#351930", "#592139", "#842a44", "#aa344e", "#ce495e", "#f27a83"]
  carbon: ["#1c1423", "#251c2c", "#3d2b3a", "#523d50", "#71586d", "#a2848f"]
  nickel: ["#312738", "#584956", "#887380", "#ad9ca6", "#d4c3c7", "#f0dde0"]
  pearl: ["#594650", "#8a717d", "#b698a6", "#d5bec3", "#ecd6d5", "#fae6e1"]
  iris: ["#4f2135", "#63213a", "#932c46", "#bd4355", "#ec787e", "#ffc1af"]
  ion: ["#174252", "#24737a", "#279e9d", "#4cd8c8", "#93f2dc", "#dcfff1"]
