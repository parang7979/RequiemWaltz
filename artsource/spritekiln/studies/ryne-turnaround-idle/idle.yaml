  face: {parent: chest, pos: "[0, 44 + 0.65*breath, 0]", rot: "[0, 0, -0.008*drift]"}
  pony: {parent: face, pos: [-67, 115, 0], rot: "[0, 0, 0.028*curl]"}
  sleeve_near: {parent: chest, pos: [-51, 11, 0], rot: "[0, 0, -0.016*cuff]"}
  sleeve_far: {parent: chest, pos: [53, 11, 0], rot: "[0, 0, 0.013*cuff]"}
animations:
  idle:
    loop: true
    frames: 40
